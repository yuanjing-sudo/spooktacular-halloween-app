name: HalloweenSpooktacularUltimate
options:
  bundleIdPrefix: com.spooktacular
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false
targets:
  HalloweenSpooktacularUltimate:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Spooktacular Ultimate
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.games
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spooktacular.ultimate
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: true
